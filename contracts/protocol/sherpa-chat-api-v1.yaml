openapi: 3.1.0
info:
  title: Sherpa Assistant Chat API
  version: 1.0.0
  description: API для взаимодействия клиентского веб-интерфейса менеджера с ассистентом дистрибутора ПО «Шерпа».

paths:
  /api/v1/chat/greeting:
    get:
      summary: Получение стартового приветствия и контекста сессии от оркестратора
      description: Возвращает персонализированное приветствие авторизованного менеджера (имя определяется на стороне бэкенда по токену сессии), состав подключенных сервисов (теги) и стартовый placeholder.
      operationId: getGreeting
      responses:
        '200':
          description: Успешная инициализация и приветствие от ассистента
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageResponse'
        '500':
          description: Ошибка связи с сервером ассистента
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/chat/message:
    post:
      summary: Отправка запроса ассистенту «Шерпа»
      description: Принимает сообщение пользователя и возвращает структурированный ответ с Markdown-разметкой и метаданными.
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
      responses:
        '200':
          description: Успешный ответ ассистента
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageResponse'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Ошибка генерации ответа ассистентом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ChatMessageRequest:
      type: object
      required:
        - message
      properties:
        conversation_id:
          type: string
          format: uuid
          description: Идентификатор сессии диалога
          example: "a2b3c4d5-e6f7-48a9-b0c1-d2e3f4a5b6c7"
        message:
          type: string
          description: Текст запроса менеджера
          example: "Подбери отечественную СУБД взамен Oracle Database"
        context:
          type: object
          description: Дополнительный контекст запроса
          properties:
            partner_inn:
              type: string
              example: "7701234567"
            current_product:
              type: string
              example: "Oracle Enterprise Edition"
        attachments:
          type: array
          description: Список прикрепленных файлов (письма, спецификации, документы)
          items:
            type: object
            required:
              - name
            properties:
              name:
                type: string
                example: "Запрос_КП_Северсталь.msg"
              size:
                type: integer
                example: 24576
              type:
                type: string
                example: "application/vnd.ms-outlook"
              content_base64:
                type: string
                description: Содержимое файла в формате Base64
                example: "SGVsbG8gV29ybGQ="

    ChatMessageResponse:
      type: object
      required:
        - id
        - conversation_id
        - text
        - sender
        - created_at
      properties:
        id:
          type: string
          format: uuid
          example: "f1e2d3c4-b5a6-4798-8091-23456789abcd"
        conversation_id:
          type: string
          format: uuid
          example: "a2b3c4d5-e6f7-48a9-b0c1-d2e3f4a5b6c7"
        sender:
          type: string
          enum: [assistant, user, system]
          example: "assistant"
        text:
          type: string
          description: Форматированный текст ответа в Server-Driven Markdown (согласованный синтаксис директив см. в contracts/markdown-ui-spec.md, включая интерактивные кнопки [Название](cmd:команда), карточки :::deal-card, блоки :::facts и контекстный :::placeholder Текст :::)
          example: "По вашему запросу рекомендую следующие СУБД:\n\n1. [Рассчитать стоимость лицензий](cmd:1)\n2. [Сравнить редакции](cmd:2)\n\n:::placeholder Спросите о сделках 1С или подборе ПО... :::"
        services:
          type: array
          description: Список подключенных к оркестратору сервисов и модулей (1C CRM, GliNER и др.), отображаемых в шапке в виде серых тегов возможностей
          items:
            type: object
            required:
              - id
              - name
            properties:
              id:
                type: string
                example: "1c_crm"
              name:
                type: string
                example: "1C CRM"
              status:
                type: string
                enum: [online, offline]
                description: Опциональный статус сервиса (диалоговая доступность обрабатывается внутри чата)
                example: "online"
          example:
            - id: "1c_crm"
              name: "1C CRM"
            - id: "gliner"
              name: "GliNER"
        created_at:
          type: string
          format: date-time
          example: "2026-08-17T15:30:00Z"

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "LLM_SERVICE_UNAVAILABLE"
        message:
          type: string
          example: "Сервис генерации временно недоступен. Пожалуйста, повторите попытку через несколько секунд."
