openapi: 3.1.0
info:
  title: Sherpa Markdown UI Directives & Components Domain Schema
  version: 1.0.0
  description: Машиночитаемая схема директив Server-Driven Markdown и интерактивных компонентов UI для sherpa-web-chat.

components:
  schemas:
    InlineCommandLink:
      type: object
      description: Интерактивная кнопка-чип в формате Markdown [Label](cmd:Command)
      required:
        - label
        - command
      properties:
        label:
          type: string
          description: Текст кнопки (может начинаться с '!' для Primary, '~' для Subtle или '1. ' для быстрого ввода)
          example: "[! Обработать открытое письмо]"
        command:
          type: string
          description: Текст команды, отправляемой на сервер при клике
          example: "Обработать открытое письмо"
        style_variant:
          type: string
          enum: [default, primary, subtle, numbered]
          example: "primary"

    PlaceholderDirective:
      type: object
      description: Директива динамической подсказки поля ввода :::placeholder <text> :::
      required:
        - placeholder_text
      properties:
        placeholder_text:
          type: string
          example: "Спросите о сделках 1С, обработайте письмо или запросите подбор ПО..."

    DealCardDirective:
      type: object
      description: Директива карточки сделки :::deal-card ... :::
      required:
        - title
      properties:
        title:
          type: string
          description: Заголовок сделки (номер, контрагент)
          example: "#CRM-2026-0854 — АО «ТрансНефть»"
        match_badge:
          type: string
          description: Бейдж процента соответствия
          example: "71% совпадение"
        metadata:
          type: string
          description: Сумма и статус
          example: "1 420 000 ₽ · Переговоры"
        comment:
          type: string
          description: Пояснение совпадения
          example: "Совпадение по ИНН и названию компании из письма"
        command:
          type: string
          description: Опциональная команда связывания сделки
          example: "Связать со сделкой #CRM-2026-0854"

    FactsDirective:
      type: object
      description: Директива структурированных фактов из письма/документа :::facts ... :::
      required:
        - lines
      properties:
        lines:
          type: array
          items:
            type: string
          example:
            - "Компания: ПАО «Северсталь» (ИНН 3528000597)"
            - "Продукт: СУБД Postgres Pro Enterprise (32 ядра)"
            - "Срок поставки: до 30.09.2026"
