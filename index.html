<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sherpa — Ассистент по продажам</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div class="chat-app-container">
    <main class="chat-window">
      <!-- Chat Header -->
      <header class="chat-header">
        <div class="header-identity">
          <div class="avatar-wrapper">
            <div class="sherpa-avatar">SH</div>
          </div>
          <div class="header-info">
            <div class="header-title-row">
              <span class="header-title">Sherpa</span>
            </div>
            <span class="header-subtitle">Ассистент по продажам</span>
          </div>
        </div>

        <div class="header-actions">
          <!-- Settings / Configuration & Logs Button -->
          <button type="button" class="fluent-button subtle icon-only" id="settingsButton" title="Параметры и диагностика" aria-label="Параметры">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>

          <button type="button" class="fluent-button subtle" id="resetButton" title="Начать новый диалог">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="1 4 1 10 7 10"></polyline>
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
            </svg>
            <span>Новый диалог</span>
          </button>
        </div>
      </header>

      <!-- Message Feed -->
      <section class="message-feed" id="messageFeed" aria-label="Лента сообщений">
        <!-- Rendered dynamically by SherpaChatApp -->
      </section>

      <!-- Composer / Input Area -->
      <footer class="chat-composer-wrap">
        <div class="attachment-preview-bar" id="attachmentPreviewBar" style="display: none;"></div>
        <form class="composer-form" id="composerForm">
          <input type="file" id="fileInput" style="display: none;" multiple aria-label="Выбор файлов для прикрепления">
          <button type="button" class="composer-action-btn" id="attachButton" title="Прикрепить файл или письмо">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
            </svg>
          </button>
          <textarea 
            class="composer-textarea" 
            id="composerTextarea" 
            rows="1" 
            placeholder=""
            aria-label="Поле ввода сообщения"
          ></textarea>
          <button type="submit" class="composer-send-btn" id="sendButton" disabled title="Отправить сообщение">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
        <div class="composer-footer-note">
          <span><strong>Enter</strong> — отправить, <strong>Shift + Enter</strong> — новая строка</span>
          <span>Sherpa Sales Chat v0.3.0 (Fluent UI)</span>
        </div>
      </footer>
    </main>

    <!-- Settings & Diagnostics Modal / Flyout -->
    <div class="settings-backdrop" id="settingsBackdrop" style="display: none;">
      <div class="settings-modal" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
        <div class="settings-modal-header">
          <div class="settings-modal-title-wrap">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-distributor-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-.273l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <h2 id="settingsModalTitle">Параметры и диагностика</h2>
          </div>
          <button type="button" class="icon-close-btn" id="closeSettingsButton" title="Закрыть окно">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="settings-modal-body">
          <!-- Mode Toggle -->
          <div class="settings-section">
            <label class="settings-label">Основной режим работы ассистента</label>
            <div class="mode-radio-group">
              <label class="mode-radio-card">
                <input type="radio" name="appMode" value="mock" id="modeMockRadio" checked>
                <div class="mode-radio-content">
                  <div class="mode-radio-title">🧪 Режим Mock (Эмуляция)</div>
                  <div class="mode-radio-desc">Автономная работа без бэкенда, полный 5-шаговый сценарий 1С CRM и каталога ПО.</div>
                </div>
              </label>

              <label class="mode-radio-card">
                <input type="radio" name="appMode" value="live" id="modeLiveRadio">
                <div class="mode-radio-content">
                  <div class="mode-radio-title">🌐 Режим Live (Боевой сервер)</div>
                  <div class="mode-radio-desc">Прямое подключение к REST API оркестратора (OpenAPI 3.1).</div>
                </div>
              </label>
            </div>
          </div>

          <!-- Mock Specific Options -->
          <div class="settings-section" id="mockOptionsSection">
            <div class="settings-row">
              <div class="settings-field">
                <label for="mock1cStatusSelect" class="settings-label">Сервис 1C CRM</label>
                <select id="mock1cStatusSelect" class="fluent-input-select">
                  <option value="online">🟢 Подключен (Online - штатная работа)</option>
                  <option value="offline">🟠 Подключен (Offline - сбой связи в диалоге)</option>
                  <option value="detached">⚪ Не подключен к оркестратору (без тега)</option>
                </select>
              </div>

              <div class="settings-field">
                <label for="mockGlinerStatusSelect" class="settings-label">Сервис GliNER</label>
                <select id="mockGlinerStatusSelect" class="fluent-input-select">
                  <option value="online">🟢 Подключен (Online - автопарсинг)</option>
                  <option value="offline">🟠 Подключен (Offline - ручной ввод)</option>
                  <option value="detached">⚪ Не подключен к оркестратору (без тега)</option>
                </select>
              </div>
            </div>

            <div class="settings-row" style="margin-top: 10px;">
              <div class="settings-field">
                <label for="mockServerStatusSelect" class="settings-label">Доступность оркестратора</label>
                <select id="mockServerStatusSelect" class="fluent-input-select">
                  <option value="online">🟢 В сети (Оркестратор доступен)</option>
                  <option value="offline">🔴 Нет связи с сервером (Сбой 500)</option>
                </select>
              </div>

              <div class="settings-field">
                <label for="mockUserNameInput" class="settings-label">Имя менеджера (для Mock-эмуляции)</label>
                <input type="text" id="mockUserNameInput" class="fluent-input-text" value="Илья" placeholder="Имя для приветствия">
              </div>
            </div>

            <div class="settings-row" style="margin-top: 10px;">
              <div class="settings-field full-width">
                <label for="mockDelayRange" class="settings-label">Имитация сетевой задержки: <span id="delayValueLabel">400</span> мс</label>
                <input type="range" id="mockDelayRange" min="0" max="2500" step="50" value="400" class="fluent-slider">
              </div>
            </div>
          </div>

          <!-- Live Specific Options -->
          <div class="settings-section" id="liveOptionsSection" style="display: none;">
            <div class="settings-field full-width">
              <label for="liveApiUrlInput" class="settings-label">URL API Оркестратора</label>
              <input type="url" id="liveApiUrlInput" class="fluent-input-text" placeholder="http://localhost:8000 или https://api.sherpa.mont.ru">
            </div>

            <div class="settings-field full-width" style="margin-top: 12px;">
              <label for="liveTokenInput" class="settings-label">Токен авторизации (Bearer JWT, опционально)</label>
              <input type="password" id="liveTokenInput" class="fluent-input-text" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...">
            </div>
          </div>

          <!-- Display Options -->
          <div class="settings-section">
            <label for="messageRenderModeSelect" class="settings-label">Отображение сообщений ассистента</label>
            <select id="messageRenderModeSelect" class="fluent-input-select">
              <option value="markdown">✨ Форматированный (Markdown, таблицы, чипы)</option>
              <option value="raw">📝 Сырой исходный текст (Raw Markdown)</option>
            </select>
          </div>

          <!-- System Logs / Diagnostics Console -->
          <div class="settings-section">
            <div class="logs-header">
              <label class="settings-label" style="margin-bottom: 0;">Журнал событий и диагностика (<span id="logCountBadge">0</span>)</label>
              <div class="logs-actions">
                <button type="button" class="fluent-button subtle compact" id="copyLogsBtn" title="Скопировать журнал">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                  </svg>
                  <span>Копировать</span>
                </button>
                <button type="button" class="fluent-button subtle compact" id="clearLogsBtn" title="Очистить журнал">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                  </svg>
                  <span>Очистить</span>
                </button>
              </div>
            </div>
            <div class="log-console" id="logConsole" role="log" aria-live="polite">
              <!-- Rendered dynamically -->
            </div>
          </div>
        </div>

        <div class="settings-modal-footer">
          <button type="button" class="fluent-button subtle" id="cancelSettingsButton">Закрыть</button>
          <button type="button" class="fluent-button primary" id="applySettingsButton">Применить и перезапустить</button>
        </div>
      </div>
    </div>
  </div>

  <script src="src/core/logger.js"></script>
  <script src="src/services/http-sherpa.service.js"></script>
  <script src="src/services/service-factory.js"></script>
  <script src="src/utils/markdown-renderer.js"></script>
  <script src="mocks/mock-assistant.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
